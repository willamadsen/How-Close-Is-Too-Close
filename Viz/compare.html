<!DOCTYPE html>
<!-- WORK IN PROGRESS: this is a working copy that is changing often. Expect unfinished features and breaking changes. -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Episode Simulation</title>
  <!-- Reuse the original page's styling so both pages look the same -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- The side panel. Everything with an id="..." is something compare.js reads or updates. -->
  <aside id="ui">
    <h1>Episode Simulation</h1>
    <p class="wipNote">Work in progress: this page is a working copy and changes often.</p>

     <hr>

  <!-- Which satellites are being modeled, and which TLE is in use right now -->
  <section class="panelSection">
    <div class="sectionTitle">Now modeling</div>
    <div id="identity"></div>
  </section>

  <section class="panelSection"> 
      <div id="rangeNote" class="methodNote"></div>
            <!-- Only when a link opened an incident: its ID, and buttons to switch pairs if it has three satellites -->
      <div id="caseBox" class="caseBox" hidden>
        <div id="caseTitle" class="sectionTitle"></div>
        <div id="casePairs" class="casePairs"></div>
      </div>
    </section>

    <hr>

    <!-- Find a satellite: opens and closes when its title is clicked ("details" does this by itself). Inside: the lookup box, then the two dropdown menus. -->
    <details id="findSection" class="panelSection findSection" open>
      <summary class="sectionTitle">Find a satellite</summary>
      <div class="lookupRow">
        <input id="lookupInput" type="text" placeholder="NORAD number, designator, or name">
        <button id="lookupBtn" type="button">Look up</button>
      </div>
      <div id="lookupResult" class="methodNote"></div>
      <!-- Shown only when the satellite found has TLE history on this site -->
      <div id="lookupActions" class="lookupRow" hidden>
        <button id="loadAsA" type="button"><span class="sourceDot slotA"></span> Load as A</button>
        <button id="loadAsB" type="button"><span class="sourceDot slotB"></span> Load as B</button>
      </div>
          <!-- The two dropdown menus. compare.js fills in the satellite names. -->
      <div class="pairPicker satPicker">
        <div>
          <label for="satA"><span class="sourceDot slotA"></span> <span id="nameA">Satellite A</span></label>
          <select id="satA"></select>
        </div>
        <div>
          <label for="satB"><span class="sourceDot slotB"></span> <span id="nameB">Satellite B</span></label>
          <select id="satB"></select>
        </div>
      </div>
    </details>

    <hr>

    <section class="panelSection">
      <div id="separationTitle" class="sectionTitle">Separation between A and B</div>
      <!-- Camera view: the whole Earth, or zoomed in with satellite A at the centre -->
      <div class="viewSwitch" aria-label="Camera view">
        <button id="earthView" class="viewSwitchOption activeViewSwitch" type="button">Full Earth</button>
        <button id="relativeView" class="viewSwitchOption" type="button">Relative motion</button>
      </div>
      <!-- Relative motion only: which satellite sits at the centre -->
      <div id="centreSwitch" class="viewSwitch centreSwitch" aria-label="Centre the relative view on" hidden>
        <button id="centreA" class="viewSwitchOption activeViewSwitch" type="button"><span
            class="sourceDot slotA"></span> <span id="centreNameA">Satellite A</span></button>
        <button id="centreB" class="viewSwitchOption" type="button"><span class="sourceDot slotB"></span> <span
            id="centreNameB">Satellite B</span></button>
      </div>
      <div id="viewNote" class="methodNote"></div>
      <div class="statsGrid">
        <div class="statBlock">
          <div id="rangeStat" class="statNumber">—</div>
          <div class="statLabel">Distance Apart</div>
        </div>
                <div class="statBlock">
          <div id="speedStat" class="statNumber">—</div>
          <div class="statLabel">Relative Speed</div>
        </div>
        <div class="statBlock">
          <div id="timeDisplay" class="statNumber small">—</div>
          <div class="statLabel">Animated UTC time</div>
        </div>
      </div>
      <canvas id="separationChart" width="300" height="150"
        aria-label="Separation distance over the last two hours"></canvas>
      <canvas id="speedChart" width="300" height="150"
        aria-label="Relative speed over the last two hours"></canvas>
      <!-- Closest approach in the chosen time window. compare.js fills this in. -->
      <div id="closestApproach" class="closestApproach" hidden>
        <button id="caViewBtn" class="caViewBtn" type="button">View closest approach</button>
        <div class="statsGrid">
          <div class="statBlock caHover">
            <div id="caDistance" class="statNumber">—</div>
            <div class="statLabel">Closest approach</div>
          </div>
          <div class="statBlock caHover">
            <div id="caTime" class="statNumber small">—</div>
            <div class="statLabel">When (UTC)</div>
          </div>
          <div class="statBlock">
            <div id="caSpeed" class="statNumber">—</div>
            <div class="statLabel">Relative speed at closest approach</div>
          </div>
        </div>
        <div id="caDetails" class="caDetails"></div>
      </div>
    </section>

    <!-- Time window: which dates to model -->
    <section class="panelSection">
      <!-- Time window: which dates to model. The Start/End pickers only show for "Custom dates". -->
      <div class="windowPicker">
        <label for="windowMode">Time window</label>
        <select id="windowMode">
          <option value="case" disabled>Reported period</option>
          <option value="caseWeek" disabled>Reported period ± 1 week</option>
          <option value="overlap" selected>Dates both satellites have TLEs</option>
          <option value="all">All TLE dates</option>
          <option value="custom">Custom dates…</option>
        </select>
      </div>
      <div id="customDates" class="pairPicker dateRange" hidden>
        <div>
          <label for="startTime">Start (UTC)</label>
          <input id="startTime" type="datetime-local" step="60">
        </div>
        <div>
          <label for="endTime">End (UTC)</label>
          <input id="endTime" type="datetime-local" step="60">
        </div>
      </div>
          </section>
  </aside>

  <!-- Playback dock: its own card below the side panel, with the time bar, play button and speed -->
  <div id="playbackDock" class="playbackDock">
      <div class="timeRow">
        <span id="sliderStart" class="sliderDate">—</span>
        <div class="sliderWrap">
          <input id="timelineSlider" type="range" min="0" max="1" value="0" step="60000">
          <div id="sliderTip" class="sliderTip" hidden></div>
        </div>
        <span id="sliderEnd" class="sliderDate">—</span>
      </div>
      <div class="controlRow">
        <button id="playBtn" class="miniControl playPauseMini" title="Play / pause" aria-label="Play / pause"><span class="playIcon"></span></button>
        <span id="sliderNow" class="sliderNow">—</span>
        <button id="speedDownBtn" class="miniControl speedMini" title="Slower" aria-label="Slower"><span class="doubleTriangle doubleTriangleLeft"></span></button>
        <span id="speedLabel" class="speedLabel">10 min/s</span>
        <button id="speedUpBtn" class="miniControl speedMini" title="Faster" aria-label="Faster"><span class="doubleTriangle doubleTriangleRight"></span></button>
        <!-- The speed menu is hidden: the arrow buttons step through its options, and compare.js reads its value -->
        <select id="speed" hidden>
          <option value="60">1 min/s</option>
          <option value="600" selected>10 min/s</option>
          <option value="3600">1 hr/s</option>
          <option value="86400">1 day/s</option>
        </select>
      </div>
     </div>

  <div id="cameraControls">
    <!-- Link back to the Google Sheet of incidents -->
    <a id="sheetBtn" class="cameraBtn" title="Open the incident sheet" aria-label="Open the incident sheet"
      href="https://docs.google.com/spreadsheets/d/1IEQ3tmerXXxEty8BcZeaonWhQbHUfA2Z5b44IuCsQ8I/edit?gid=0#gid=0"
      target="_blank" rel="noopener">
      <img src="assets/espl-github-icon.png" alt="">
    </a>
    <button id="zoomInBtn" class="cameraBtn" title="Zoom in">+</button>
    <button id="zoomOutBtn" class="cameraBtn" title="Zoom out">−</button>
    <button id="resetBtn" class="cameraBtn" title="Reset view">⌂</button>
    <!-- Relative motion only: show or hide the radial / along-track / cross-track axes -->
    <button id="axesBtn" class="cameraBtn axesBtn"
      title="Show or hide direction axes (radial, along-track, cross-track)" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M6 18 L6 5 M6 18 L19 18 M6 18 L15 9" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" />
      </svg>
    </button>

  </div>
  <div id="brand"><img src="assets/ESPL.png" alt="Engineering Space Policy Laboratory"></div>
    
  <!-- A few styles only this page needs -->
  <style>
    .pairPicker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .pairPicker label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .satPicker {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    /* A and B stacked, so long names fit */
    .wipNote {
      margin: 4px 0 8px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #fff4d6;
      color: #7a5a00;
      font-size: 11px;
      font-weight: 650;
    }

    .overlapToggle {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 12px;
      color: #444;
      cursor: pointer;
    }

    .overlapToggle input {
      margin: 0;
    }

    .dateRange {
      margin-top: 6px;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .dateRange>div {
      display: grid;
      grid-template-columns: 78px 1fr;
      align-items: center;
    }

    .dateRange label {
      margin: 0;
    }

    .dateRange input {
      width: 100%;
      min-width: 0;
      height: 32px;
      padding: 0 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      color: #444;
      font: inherit;
      font-size: 12px;
    }

    .sourceDot.slotA {
      background: #eaaa00;
    }

    .sourceDot.slotB {
      background: #7a7a7a;
    }

    /* Playback buttons with drawn icons, in the style of the lab's sbi-constellation-viz */
    .playbackDock .miniControl {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 26px;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
    }
    .playbackDock .miniControl:hover { background: #f0f0f0; }
    .playbackDock .miniControl:disabled { opacity: .3; background: transparent; cursor: default; }
    .playPauseMini { width: 30px; }
    .speedMini { width: 26px; }

    /* Play: a triangle made from borders. Pause: two bars drawn as backgrounds. */
    .playIcon {
      width: 0;
      height: 0;
      margin-left: 2px;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 10px solid #444;
    }
    .pauseIcon {
      width: 9px;
      height: 12px;
      background:
        linear-gradient(#444 0 0) left / 3px 100% no-repeat,
        linear-gradient(#444 0 0) right / 3px 100% no-repeat;
    }

    /* Slower / faster: two small triangles side by side */
    .doubleTriangle { display: inline-flex; gap: 1px; align-items: center; }
    .doubleTriangle::before, .doubleTriangle::after {
      content: "";
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
    }
    .doubleTriangleLeft::before, .doubleTriangleLeft::after { border-right: 5px solid #555; }
    .doubleTriangleRight::before, .doubleTriangleRight::after { border-left: 5px solid #555; }

    .speedLabel {
      min-width: 52px;
      font-size: 11px;
      color: #555;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .identityCard {
      padding: 8px 0;
      border-top: 1px solid #eee;
      font-size: 11px;
      line-height: 1.4;
    }

    .identityCard:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .identityMeta {
      color: #777;
      font-variant-numeric: tabular-nums;
    }

    .tleAge.stale {
      color: #b00020;
      font-weight: 700;
    }

    .tleAge.aging {
      color: #9b6d00;
      font-weight: 700;
    }

    .dataWarning {
      margin-top: 3px;
      color: #9b6d00;
    }
    
    /* Find a satellite: a title with a small arrow that turns when the section is open */
    .findSection summary {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      list-style: none;
    }

    .findSection summary::-webkit-details-marker {
      display: none;
    }

    .findSection summary::before {
      content: "▸";
      font-size: 13px;
      transition: transform .15s;
    }

    .findSection[open] summary::before {
      transform: rotate(90deg);
    }

    .findSection .satPicker {
      margin-top: 12px;
    }


    .lookupRow {
      display: flex;
      gap: 6px;
    }

    .lookupRow input {
      flex: 1;
      min-width: 0;
      height: 32px;
      padding: 0 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font: inherit;
      font-size: 12px;
    }

    .lookupRow button {
      height: 32px;
      padding: 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    .lookupRow button:hover {
      background: #f7f7f7;
    }

    #lookupResult {
      white-space: pre-line;
    }

    /* .lookupRow sets display:flex, which would override "hidden", so say explicitly that hidden means hidden */
    #lookupActions[hidden] {
      display: none;
    }

    .centreSwitch {
      margin-top: 6px;
    }

    .centreSwitch[hidden] {
      display: none;
    }

    /* .viewSwitch sets display:flex, which would override "hidden" */
    .cameraBtn.isOn {
      color: #fff;
      background: #555;
    }

    /* the axes button when the axes are showing */
    .axesBtn {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* centre the icon in the button */
    .axesBtn[hidden] {
      display: none;
    }

    #sheetBtn {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      overflow: hidden;
    }

    #sheetBtn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    /* display:flex would otherwise override "hidden" */
    .centreSwitch .viewSwitchOption {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #lookupActions {
      margin-top: 6px;
    }

    #lookupActions button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .closestApproach {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
        #speedChart {
      width: 100%;
      height: 150px;
      margin-top: 10px;
    }

    .flagIcon {
      height: 0.9em;
      margin-right: 3px;
      vertical-align: -0.1em;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .15);
    }


    .caseBox {
      margin-top: 10px;
    }

    .casePairs {
      display: grid;
      gap: 6px;
      margin-top: 6px;
    }

    .casePairs button {
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #444;
      font: inherit;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
    }

    .casePairs button.activePair {
      border-color: #333;
      background: #333;
      color: #fff;
    }
    /* The closest-approach note: a pop-up when the mouse is over the distance or the time */
    .closestApproach {
      position: relative;
    }

    .caDetails {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% - 44px);   /* opens upward, just above the numbers, so the bottom bar can't hide it */
      z-index: 5;
      padding: 7px 9px;
      border-radius: 6px;
      background: #333;
      color: #fff;
      font-size: 11px;
      line-height: 1.4;
      pointer-events: none;
    }

    .closestApproach:has(.caHover:hover) .caDetails {
      display: block;
    }

    .caViewBtn {
      width: 100%;
      height: 32px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    .caViewBtn:hover {
      background: #f7f7f7;
    }

    .sliderWrap {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
    }

    .sliderWrap #timelineSlider {
      width: 100%;
    }

    .sliderDate {
      font-size: 10px;
      color: #777;
      white-space: nowrap;
    }

    .sliderTip {
      position: absolute;
      bottom: calc(100% + 6px);
      transform: translateX(-50%);
      padding: 3px 6px;
      border-radius: 5px;
      background: #333;
      color: #fff;
      font-size: 11px;
      white-space: pre;
      text-align: center;
      pointer-events: none;
    }

    .sliderTip[hidden] {
      display: none;
    }

    /* Keep the title at the top of the panel while scrolling */
    #ui h1 {
      position: sticky;
      top: -16px;
      z-index: 2;
      margin: -16px -16px 8px;
      padding: 16px 16px 8px;
      border-bottom: 1px solid #ddd;
      background: rgba(255, 255, 255, .97);
    }

        /* Playback dock: its own card under the side panel (style from the lab's sbi-constellation-viz) */
    .playbackDock {
      position: fixed;
      z-index: 10;
      left: 18px;
      bottom: 18px;
      width: 345px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 16px 9px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 12px 35px rgba(0, 0, 0, .10);
      backdrop-filter: blur(10px);
    }

    /* The side panel stops above the dock instead of running behind it */
    #ui {
      max-height: calc(100vh - 36px - 92px);
    }

    @media (max-width: 760px) {
      .playbackDock { width: calc(100vw - 36px); }
      #ui { max-height: calc(52vh - 92px); }
    }

    .timeRow,
    .controlRow {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sliderNow {
      flex: 1;
      font-size: 11px;
      color: #555;
      font-variant-numeric: tabular-nums;
    }

    .windowPicker {
      display: grid;
      grid-template-columns: 78px 1fr;
      align-items: center;
      margin-top: 10px;
      font-size: 12px;
    }

    #customDates[hidden] {
      display: none;
    }

        /* The time bar, drawn by us instead of the browser so part of the track can be shaded.
       --bandStart and --bandEnd (set by compare.js) mark the reported period: 0% to 0% = no band. */
    #timelineSlider {
      -webkit-appearance: none;
      appearance: none;
      height: 16px;
      background: transparent;
      --bandStart: 0%;
      --bandEnd: 0%;
      --progress: 0%;
    }
    /* Three layers, top first: the reported period (a dark tint), the gold "played so far" part, the grey track */
    #timelineSlider::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 999px;
      background:
        linear-gradient(to right, transparent var(--bandStart), rgba(0, 0, 0, .45) var(--bandStart) var(--bandEnd), transparent var(--bandEnd)),
        linear-gradient(to right, #d6a516 var(--progress), #d8d8d8 var(--progress));
    }
    #timelineSlider::-moz-range-track {
      height: 3px;
      border-radius: 999px;
      background:
        linear-gradient(to right, transparent var(--bandStart), rgba(0, 0, 0, .45) var(--bandStart) var(--bandEnd), transparent var(--bandEnd)),
        linear-gradient(to right, #d6a516 var(--progress), #d8d8d8 var(--progress));
    }
    /* The handle: a thin dark bar */
    #timelineSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 3px;
      height: 14px;
      margin-top: -5.5px;
      border-radius: 2px;
      background: #111;
    }
    #timelineSlider::-moz-range-thumb {
      width: 3px;
      height: 14px;
      border: 0;
      border-radius: 2px;
      background: #111;
    }
  </style>

  <!-- satellite.js does the SGP4 orbit math. It is a classic script that creates a global "satellite" object. -->
  <script src="vendor/satellite/satellite.min.js"></script>
  <!-- Tell the browser where to find the 3D and map libraries, then load our code -->
  <script
    type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/","topojson-client":"./vendor/topojson/topojson-client.js"}}</script>
  <script type="module" src="compare.js"></script>
</body>

</html>
